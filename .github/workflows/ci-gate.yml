# THROWAWAY. AC-35 enforcement proof only. This branch must never be
# merged. It removes the evaluation-gate job and the deployment-demo
# job that depended on it, keeping the workflow valid with one
# differently named no-op job, so that the only thing missing on the
# pull request is the required evaluation-gate check.

name: ci-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  throwaway-noop:
    name: throwaway-noop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op
        run: echo "throwaway no-op job; evaluation-gate is intentionally absent"
